services:
  app:
    image: ghcr.io/svenger87/tesla_order_tracker:master
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:/app/data/prod.db
    volumes:
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Daily snapshot of the production database, taken on this machine rather than
  # by anything that has to reach it from outside. Backups are the one thing that
  # should not depend on an external service being available.
  #
  # Same image as the app, so it always has the matching better-sqlite3 build and
  # ships with every deploy. It writes into the same volume as the database:
  # that covers a bad edit, a bad sync or a bad delete — not the loss of this
  # machine, which needs an off-site copy this does not attempt.
  backup-cron:
    image: ghcr.io/svenger87/tesla_order_tracker:master
    restart: unless-stopped
    environment:
      - BACKUP_KEEP=20
    volumes:
      - sqlite_data:/app/data
    # A snapshot on start, then one a day. --min-age-hours makes the start-up run
    # a no-op when a recent one already exists, so redeploying ten times in an
    # afternoon does not push every older snapshot out of a twenty-deep history.
    entrypoint:
      - sh
      - -c
      - >
        while true; do
          node /app/scripts/backup.mjs /app/data/prod.db --min-age-hours 20 || true;
          sleep 86400;
        done

  app-staging:
    image: ghcr.io/svenger87/tesla_order_tracker:staging
    command: >
      sh -c "node scripts/migrate-schema.mjs && node server.js"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env.staging
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:/app/data/staging.db
    volumes:
      - sqlite_data_staging:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      umami-db:
        condition: service_healthy

  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sqlite_data:
  sqlite_data_staging:
  caddy_data:
  caddy_config:
  uptime_kuma_data:
  umami_db_data:
