name: Staging data

# Manual only. Nothing here should ever run because a branch moved.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which database the repair, archive and delete steps act on'
        type: choice
        required: true
        default: staging
        options: [staging, production]
      repair_data:
        description: 'Repair dates, the gb country code, and durations that contradict their dates'
        type: boolean
        required: true
        default: false
      archive_pairs:
        description: 'Rows to archive, as id=name,id=name — takes them out of the list and every statistic, reversibly'
        required: false
        default: ''
      delete_pairs:
        description: 'Rows to delete for good, as id=name,id=name — prefer archiving; this cannot be undone'
        required: false
        default: ''
      copy_to_staging:
        description: 'Copy production over the staging database'
        type: boolean
        required: true
        default: true

concurrency:
  group: staging-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run on the VPS
        uses: appleboy/ssh-action@v1
        env:
          TARGET: ${{ inputs.target }}
          REPAIR: ${{ inputs.repair_data }}
          ARCHIVE_PAIRS: ${{ inputs.archive_pairs }}
          DELETE_PAIRS: ${{ inputs.delete_pairs }}
          COPY: ${{ inputs.copy_to_staging }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TARGET,REPAIR,ARCHIVE_PAIRS,DELETE_PAIRS,COPY
          script: |
            set -e
            cd /opt/tesla-order-tracker

            # Both databases live in named volumes on this host. Everything below
            # runs in a throwaway container with those volumes mounted, so the
            # data never leaves the machine.
            IMAGE=ghcr.io/svenger87/tesla_order_tracker:staging
            STAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)

            # Resolved rather than assumed. Mounting a volume name that does not
            # exist does not fail — Docker creates an empty one — so a wrong
            # guess here would look like a database with no orders in it.
            PROD_VOL=$(docker volume ls --format '{{.Name}}' | grep -E '_sqlite_data$' | head -1)
            STAGING_VOL=$(docker volume ls --format '{{.Name}}' | grep -E '_sqlite_data_staging$' | head -1)
            if [ -z "$PROD_VOL" ] || [ -z "$STAGING_VOL" ]; then
              echo ">>> Could not find both database volumes:"
              docker volume ls --format '  {{.Name}}'
              exit 1
            fi
            echo ">>> Production volume: $PROD_VOL"
            echo ">>> Staging volume:    $STAGING_VOL"
            MOUNTS="-v $PROD_VOL:/prod -v $STAGING_VOL:/staging"

            # Everything below writes to $DB. Staging is the default so a repair
            # can be seen on the site before it reaches anyone's real data.
            if [ "$TARGET" = "production" ]; then
              DB=/prod/prod.db
              APP=app
            else
              DB=/staging/staging.db
              APP=app-staging
            fi
            echo ">>> Acting on: $TARGET ($DB)"

            git fetch origin staging
            git checkout origin/staging -- scripts/copy-sqlite.mjs scripts/delete-order.mjs scripts/archive-order.mjs scripts/repair-orders.mjs

            # Through the backup API, not cp: these databases run in WAL mode, so
            # the newest writes sit in prod.db-wal and a file copy would leave
            # them behind — a backup quietly missing whatever happened last.
            # Back up whatever is about to be written, through the backup API
            # rather than cp: these databases run in WAL mode, so the newest
            # writes sit in a -wal file that a file copy leaves behind.
            echo ">>> Backing up $DB before touching anything"
            docker run --rm $MOUNTS -v "$PWD/scripts:/app/ops:ro" "$IMAGE" \
              node /app/ops/copy-sqlite.mjs "$DB" "$DB.before-$STAMP"

            TOUCHED=0

            # Repair before deleting: one of the duplicate pairs only becomes
            # decidable once its unreadable date can be read, and the rule for
            # which row to keep is "the one that has an order date".
            if [ "$REPAIR" = "true" ]; then
              echo ">>> Dry run of the repair"
              docker run --rm $MOUNTS -v "$PWD/scripts:/app/ops:ro" "$IMAGE" \
                node /app/ops/repair-orders.mjs "$DB"

              echo ">>> Applying repair"
              docker run --rm $MOUNTS -v "$PWD/scripts:/app/ops:ro" "$IMAGE" \
                node /app/ops/repair-orders.mjs "$DB" --apply
              TOUCHED=1
            else
              echo ">>> No repair requested"
            fi

            # One helper for both lists. A row whose --expect-name does not match
            # is reported and skipped rather than ending the run: the guard doing
            # its job on one pair is not a reason to abandon the others, and a
            # silent abort halfway through is worse than a listed failure.
            FAILED=""
            run_pairs() {
              SCRIPT="$1"
              PAIRS="$2"
              OLD_IFS="$IFS"
              IFS=','
              for pair in $PAIRS; do
                IFS="$OLD_IFS"
                [ -z "$pair" ] && continue
                ID="${pair%%=*}"
                NAME="${pair#*=}"
                echo ">>> Dry run ($SCRIPT): $ID"
                if ! docker run --rm $MOUNTS -v "$PWD/scripts:/app/ops:ro" "$IMAGE" \
                     node "/app/ops/$SCRIPT" "$DB" "$ID" --expect-name "$NAME"; then
                  echo ">>> REFUSED: $ID — left alone"
                  FAILED="$FAILED $ID"
                  IFS=','
                  continue
                fi
                echo ">>> Applying ($SCRIPT): $ID"
                docker run --rm $MOUNTS -v "$PWD/scripts:/app/ops:ro" "$IMAGE" \
                  node "/app/ops/$SCRIPT" "$DB" "$ID" --expect-name "$NAME" --apply
                TOUCHED=1
                IFS=','
              done
              IFS="$OLD_IFS"
            }

            if [ -n "$ARCHIVE_PAIRS" ]; then
              run_pairs archive-order.mjs "$ARCHIVE_PAIRS"
            else
              echo ">>> Nothing to archive"
            fi

            if [ -n "$DELETE_PAIRS" ]; then
              run_pairs delete-order.mjs "$DELETE_PAIRS"
            else
              echo ">>> No deletions requested"
            fi

            if [ -n "$FAILED" ]; then
              echo ">>> These were refused by their name guard and left untouched:$FAILED"
            fi

            # Production caches the order list in memory per process; a restart
            # is the honest way to make a data change visible.
            if [ "$TOUCHED" = "1" ]; then
              docker compose restart "$APP"
            fi

            # Refuses rather than guesses: copying production over staging after
            # repairing staging would throw the repair away, and the person who
            # ticked both boxes did not mean that.
            if [ "$COPY" = "true" ] && [ "$TARGET" = "staging" ] && [ "$TOUCHED" = "1" ]; then
              echo ">>> Refusing to copy production over the staging changes just made"
              echo ">>> Run the copy on its own if that is what you want"
              exit 1
            fi

            if [ "$COPY" = "true" ]; then
              echo ">>> Copying production over staging"
              docker run --rm $MOUNTS -v "$PWD/scripts:/app/ops:ro" "$IMAGE" \
                node /app/ops/copy-sqlite.mjs /prod/prod.db /staging/staging.db

              # Staging runs the schema migration on start, which is what brings
              # a production-shaped database up to whatever staging expects.
              docker compose restart app-staging
            else
              echo ">>> Staging left alone"
            fi

            echo ">>> Done"
