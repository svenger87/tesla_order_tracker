name: Build & Deploy

on:
  push:
    branches: [master, staging]
    # A change to a workflow file or a document does not change the image, and
    # rebuilding production to deploy identical code is a restart nobody asked
    # for. scripts/ is deliberately NOT ignored: migrate-schema.mjs runs when the
    # container starts, so those do ship.
    paths-ignore:
      - '.github/**'
      - '**.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Production only. Baking the id into the staging image made that
          # build render the analytics script, and staging has no /u/ proxy —
          # so every page there fetched /u/script.js and got a 404. Proxying it
          # instead would have mixed staging traffic into the production
          # numbers, which is worse than not measuring staging at all.
          build-args: |
            UMAMI_WEBSITE_ID=${{ github.ref_name == 'master' && vars.UMAMI_WEBSITE_ID || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/tesla-order-tracker

            # Determine which service to deploy
            if [ "${{ github.ref_name }}" = "master" ]; then
              SERVICE=app
              PORT=3000
            else
              SERVICE=app-staging
              PORT=3001
            fi

            echo ">>> Deploying $SERVICE from branch ${{ github.ref_name }}"

            # Update config files from the pushed branch
            git fetch origin ${{ github.ref_name }}
            git checkout origin/${{ github.ref_name }} -- docker-compose.yml

            # The Caddyfile is written in place rather than checked out. Docker
            # bind-mounts a single file by inode, and `git checkout` replaces the
            # file instead of rewriting it — which silently detaches the mount, so
            # the container keeps serving the copy it started with no matter how
            # often the config is "updated" and reloaded.
            git show origin/${{ github.ref_name }}:Caddyfile > Caddyfile

            # Log in and pull the new image (NEVER build on VPS)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Every deploy pulls a new image and leaves the one it replaced
            # behind untagged. Nothing ever removed those, so 88 images had
            # grown to 33GB on a 38GB disk and filled it. What that cost was not
            # a failed pull: with no space left SQLite could not create the
            # shared-memory file for WAL, so the app died at boot on
            # `PRAGMA journal_mode = WAL` — and the rollback image died of the
            # same thing, which is how a failed deploy became an outage.
            #
            # Dangling images only. Anything a container still references is
            # left alone, including the image running right now, which is the
            # rollback target a few lines below.
            echo ">>> Disk before cleanup: $(df -h / | awk 'NR==2 {print $4" free, "$5" used"}')"
            docker image prune -f
            echo ">>> Disk after cleanup:  $(df -h / | awk 'NR==2 {print $4" free, "$5" used"}')"

            # Stop while the site is still up rather than half-way through.
            # A deploy that runs out of disk does not fail cleanly — it takes
            # the running container with it — so the last safe moment to give up
            # is before anything gets recreated. One image is ~550MB.
            AVAIL_MB=$(df -Pm / | awk 'NR==2 {print $4}')
            if [ "$AVAIL_MB" -lt 3000 ]; then
              echo ">>> Only ${AVAIL_MB}MB free after cleanup — refusing to deploy."
              echo ">>> Nothing has been touched; $SERVICE is still serving. Free space on the host."
              docker logout ghcr.io 2>/dev/null || true
              exit 1
            fi

            docker compose pull $SERVICE

            # Save current image ID for rollback
            OLD_IMAGE=$(docker inspect tesla-order-tracker-${SERVICE}-1 --format '{{.Image}}' 2>/dev/null || echo "")

            # Restart the target service and reload Caddy config
            docker compose up -d --no-deps $SERVICE

            # The backup sidecar runs the production image and is only touched on
            # a master deploy. Without this it would sit in docker-compose.yml
            # and never start, because the deploy only ever brings up one
            # service by name — a backup nobody notices is not running is worse
            # than one that was never configured.
            if [ "$SERVICE" = "app" ]; then
              docker compose pull backup-cron
              docker compose up -d --no-deps backup-cron
            fi

            # This was `2>/dev/null || true`, so a rejected or unreloadable
            # Caddyfile looked exactly like a clean deploy: the job went green,
            # the config never took effect, and nothing anywhere said so.
            CADDY_OK=1

            # Catches a detached bind mount directly: if these differ, the
            # container is reading something other than the repo's config and
            # every reload below is operating on the wrong file.
            echo ">>> Checking the container sees the current Caddyfile"
            if ! docker compose exec -T caddy cat /etc/caddy/Caddyfile | diff -q - Caddyfile >/dev/null; then
              echo ">>> MISMATCH: the Caddyfile inside the caddy container is not the one in the repo."
              echo ">>> Recreating the caddy container to re-attach the mount"
              docker compose up -d --force-recreate caddy
              sleep 3
              if ! docker compose exec -T caddy cat /etc/caddy/Caddyfile | diff -q - Caddyfile >/dev/null; then
                echo ">>> Still mismatched after recreate — not a stale mount, needs a look"
                CADDY_OK=0
              fi
            fi

            echo ">>> Validating Caddyfile"
            if ! docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile; then
              echo ">>> Caddyfile is INVALID — the running proxy config is left untouched"
              CADDY_OK=0
            else
              echo ">>> Reloading Caddy"
              if ! docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile; then
                echo ">>> Caddy reload FAILED — the running proxy config is left untouched"
                CADDY_OK=0
              fi
            fi

            # Wait for health check
            echo ">>> Waiting for health check on port $PORT..."
            for i in $(seq 1 30); do
              if wget -qO- http://localhost:$PORT/api/health 2>/dev/null | grep -q '"ok"'; then
                echo ">>> Health check passed!"
                docker logout ghcr.io 2>/dev/null || true
                # The app is up either way — no rollback for a proxy problem —
                # but a deploy whose config never applied is not a success.
                if [ "$CADDY_OK" != "1" ]; then
                  echo ">>> App is healthy, but the Caddy config was NOT applied (see above)."
                  exit 1
                fi
                exit 0
              fi
              sleep 2
            done

            # Rollback on failure
            echo ">>> Health check FAILED — rolling back"
            if [ -n "$OLD_IMAGE" ]; then
              docker tag "$OLD_IMAGE" ghcr.io/svenger87/tesla_order_tracker:${{ github.ref_name }}
              docker compose up -d --no-deps $SERVICE
            fi
            docker logout ghcr.io 2>/dev/null || true
            exit 1
